<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Study & To-Do Hub — Group Quiz App</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./todo-list.css" />
</head>
<body>
  <canvas id="bg-3d-canvas"></canvas>

  <header class="navbar-3d">
    <div class="brand-logo">✅ 3D STUDY & TASK HUB</div>
    <nav class="nav-links-3d">
      <a href="./index.html">🎮 Quiz Arena</a>
      <a href="./admin.html">🛡️ Admin Panel</a>
      <button class="btn-3d" id="themeToggleBtn">🌗 Theme</button>
    </nav>
  </header>

  <main class="container-3d">
    <div class="grid-3d">
      <section class="card-3d">
        <span class="badge-3d">📝 ADD NEW STUDY TASK</span>
        <h3>Create Daily Goal</h3>
        <input type="text" id="todoTitleInput" placeholder="Task title (e.g., Revise Lok Sabha Notes)" />
        <select id="todoPriorityInput">
          <option value="high">🔥 High Priority</option>
          <option value="medium">⚡ Medium Priority</option>
          <option value="low">🌱 Low Priority</option>
        </select>
        <button class="btn-3d primary" id="addTodoBtn" style="width: 100%; justify-content: center;">
          ➕ Add 3D Task Card
        </button>
      </section>

      <section class="card-3d" style="grid-column: span 2;">
        <span class="badge-3d">📊 DAILY PROGRESS & TASKS</span>
        <h3>Your Active Study Queue</h3>
        <div id="todoListContainer" class="grid-3d"></div>
      </section>
    </div>
  </main>

  <script src="./todo-security.js" defer></script>
  <script src="./todo-task-view.js" defer></script>
  <script src="./todo-dashboard.js" defer></script>
  <script src="./todo-insights.js" defer></script>
  <script src="./todo-reports.js" defer></script>
  <script src="./todo-list.js" defer></script>
  <script src="./modern-3d-engine.js" defer></script>
</body>
</html>
